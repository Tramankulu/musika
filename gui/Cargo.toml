[package]
name = "musika-gui"
version = "0.6.0"
edition = "2021"
description = "Ventana de escritorio para musika"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 3
strip = true
