name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04: el ejecutable sirve en esa versión y en las posteriores.
          - os: ubuntu-22.04
            bin: musika
            name: musika-ubuntu
          - os: windows-latest
            bin: musika.exe
            name: musika-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Crear el .deb (Ubuntu)
        if: runner.os == 'Linux'
        run: sh empaquetado/deb.sh
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/${{ matrix.bin }} -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            musika_*.deb
            ${{ matrix.name }}.zip
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            musika_*.deb
            ${{ matrix.name }}.zip
