name: build

on:
  push:
    branches: [main, gui]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04: el ejecutable sirve en esa versión y en las posteriores.
          - os: ubuntu-22.04
            bin: musika
            name: musika-ubuntu
          - os: windows-latest
            bin: musika.exe
            name: musika-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Librerías para compilar la ventana (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Compilar la ventana de escritorio
        run: cargo build --release --manifest-path gui/Cargo.toml
      - name: Crear el .deb (Ubuntu)
        if: runner.os == 'Linux'
        run: sh empaquetado/deb.sh
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/musika.exe, gui/target/release/musika-gui.exe -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            musika_*.deb
            ${{ matrix.name }}.zip

  # Publica una release con cada subida a main, etiquetada con la versión de
  # Cargo.toml (v0.5.0, v0.6.0…). Si esa versión ya tenía release, se sustituye.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          ls -la paquetes
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" paquetes/* \
            --target "$GITHUB_SHA" \
            --title "musika $version" \
            --notes "Instalación en Ubuntu: \`sudo apt install ./musika_${version}_amd64.deb\`. En Windows, descomprime \`musika-windows.zip\`. Hace falta FFmpeg (el .deb lo instala solo)."
